name: Build Windows EXE

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller build_exe.spec --noconfirm

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SubjectiveSpreadsheetTool -DestinationPath dist/SubjectiveSpreadsheetTool-windows.zip -Force

      - name: Upload application folder
        uses: actions/upload-artifact@v4
        with:
          name: SubjectiveSpreadsheetTool-windows
          path: dist/SubjectiveSpreadsheetTool/
          retention-days: 30

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: SubjectiveSpreadsheetTool-windows-zip
          path: dist/SubjectiveSpreadsheetTool-windows.zip
          retention-days: 30
